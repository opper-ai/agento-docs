basePath: /v1
definitions:
  handlers.AddTeamMemberRequest:
    properties:
      role:
        type: string
      user_id:
        type: integer
    required:
    - role
    - user_id
    type: object
  handlers.AgentResponse:
    properties:
      created_at:
        type: string
      created_by_id:
        type: integer
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: string
      instructions:
        type: string
      name:
        type: string
      project_id:
        type: integer
      team_id:
        type: integer
      updated_at:
        type: string
      user_preferences: {}
    type: object
  handlers.AgentRunResponse:
    properties:
      agent_id:
        type: string
      created_at:
        type: string
      duration:
        type: integer
      error:
        type: string
      id:
        type: string
      input:
        type: string
      metadata: {}
      output:
        type: string
      status:
        type: string
      team_id:
        type: integer
      updated_at:
        type: string
      usage: {}
    type: object
  handlers.Balance:
    properties:
      monthly_credits_left:
        type: integer
      monthly_credits_purchased:
        type: integer
      paid_credits_left:
        type: integer
    type: object
  handlers.Billing:
    properties:
      balance:
        $ref: '#/definitions/handlers.Balance'
      plan:
        type: string
      stripe_customer_id:
        type: string
      stripe_subscription_id:
        type: string
    type: object
  handlers.BillingOverviewData:
    properties:
      current_plan:
        additionalProperties: true
        type: object
      usage:
        items:
          $ref: '#/definitions/handlers.Usage'
        type: array
    type: object
  handlers.BuildAgentRequest:
    properties:
      current_prompt:
        type: string
      user_instructions:
        type: string
    required:
    - user_instructions
    type: object
  handlers.BuildAgentResponse:
    properties:
      changes:
        type: string
      improved_prompt:
        type: string
    type: object
  handlers.CheckoutRequest:
    properties:
      amount:
        description: required for credit_topup (in cents)
        type: integer
      cancel_url:
        type: string
      credits:
        description: required for credit_topup
        type: integer
      price_id:
        description: required for upgrade_to_pro
        type: string
      success_url:
        type: string
      type:
        description: '"upgrade_to_pro" or "credit_topup"'
        type: string
    required:
    - cancel_url
    - success_url
    - type
    type: object
  handlers.CheckoutResponse:
    properties:
      url:
        type: string
    type: object
  handlers.CreateAgentRequest:
    properties:
      description:
        type: string
      instructions:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  handlers.CreateSubscriptionRequest:
    properties:
      price_id:
        type: string
    required:
    - price_id
    type: object
  handlers.CreateTeamRequest:
    properties:
      description:
        type: string
      name:
        type: string
      stripe_customer_id:
        type: string
    required:
    - name
    type: object
  handlers.DeleteResponse:
    properties:
      deleted:
        type: boolean
      message:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.MeResponse:
    properties:
      auth0_id:
        type: string
      billing:
        $ref: '#/definitions/handlers.Billing'
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      id:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  handlers.Paginated-handlers_AgentResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.AgentResponse'
        type: array
      meta:
        $ref: '#/definitions/handlers.PaginationMeta'
    type: object
  handlers.Paginated-handlers_AgentRunResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.AgentRunResponse'
        type: array
      meta:
        $ref: '#/definitions/handlers.PaginationMeta'
    type: object
  handlers.Paginated-handlers_TeamMemberResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.TeamMemberResponse'
        type: array
      meta:
        $ref: '#/definitions/handlers.PaginationMeta'
    type: object
  handlers.Paginated-handlers_TeamResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.TeamResponse'
        type: array
      meta:
        $ref: '#/definitions/handlers.PaginationMeta'
    type: object
  handlers.Paginated-handlers_Usage:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.Usage'
        type: array
      meta:
        $ref: '#/definitions/handlers.PaginationMeta'
    type: object
  handlers.Paginated-handlers_UserResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.UserResponse'
        type: array
      meta:
        $ref: '#/definitions/handlers.PaginationMeta'
    type: object
  handlers.Paginated-models_ProjectWithCreatorResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.ProjectWithCreatorResponse'
        type: array
      meta:
        $ref: '#/definitions/handlers.PaginationMeta'
    type: object
  handlers.PaginationMeta:
    properties:
      page:
        example: 1
        type: integer
      page_size:
        example: 10
        type: integer
      total_count:
        example: 100
        type: integer
      total_pages:
        example: 10
        type: integer
    type: object
  handlers.PortalRequest:
    properties:
      return_url:
        type: string
    required:
    - return_url
    type: object
  handlers.PortalResponse:
    properties:
      url:
        type: string
    type: object
  handlers.RunAgentRequest:
    properties:
      input:
        type: string
      metadata: {}
      model:
        type: string
    type: object
  handlers.SingleResponse-handlers_AgentResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.AgentResponse'
    type: object
  handlers.SingleResponse-handlers_AgentRunResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.AgentRunResponse'
    type: object
  handlers.SingleResponse-handlers_BillingOverviewData:
    properties:
      data:
        $ref: '#/definitions/handlers.BillingOverviewData'
    type: object
  handlers.SingleResponse-handlers_BuildAgentResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.BuildAgentResponse'
    type: object
  handlers.SingleResponse-handlers_CheckoutResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.CheckoutResponse'
    type: object
  handlers.SingleResponse-handlers_MeResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.MeResponse'
    type: object
  handlers.SingleResponse-handlers_PortalResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.PortalResponse'
    type: object
  handlers.SingleResponse-handlers_TeamMemberResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.TeamMemberResponse'
    type: object
  handlers.SingleResponse-handlers_TeamResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.TeamResponse'
    type: object
  handlers.SingleResponse-handlers_TopupResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.TopupResponse'
    type: object
  handlers.SingleResponse-handlers_UserResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.UserResponse'
    type: object
  handlers.SuccessResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  handlers.TeamMemberResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
      team_id:
        type: integer
      user_id:
        type: integer
    type: object
  handlers.TeamResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  handlers.TopupRequest:
    properties:
      price_id:
        description: Stripe price ID
        type: string
    required:
    - price_id
    type: object
  handlers.TopupResponse:
    properties:
      message:
        description: success/error message
        type: string
