basePath: /v1
definitions:
  handlers.AgentBuilderLogResponse:
    properties:
      agent_id:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      metadata: {}
      parent_log_id:
        type: string
      project_id:
        type: integer
      team_id:
        type: integer
      type:
        type: string
      updated_at:
        type: string
      user_email:
        type: string
      user_id:
        type: integer
    type: object
  handlers.AgentResponse:
    properties:
      created_at:
        type: string
      created_by_id:
        type: integer
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: string
      instructions:
        type: string
      name:
        type: string
      project_id:
        type: integer
      team_id:
        type: integer
      updated_at:
        type: string
      user_preferences: {}
    type: object
  handlers.AgentRunResponse:
    properties:
      agent_id:
        type: string
      created_at:
        type: string
      duration:
        type: integer
      error:
        type: string
      id:
        type: string
      input:
        type: string
      metadata: {}
      output:
        type: string
      status:
        type: string
      team_id:
        type: integer
      updated_at:
        type: string
      usage: {}
    type: object
  handlers.Balance:
    properties:
      monthly_credits_left:
        type: integer
      monthly_credits_purchased:
        type: integer
      paid_credits_left:
        type: integer
    type: object
  handlers.Billing:
    properties:
      balance:
        $ref: '#/definitions/handlers.Balance'
      plan:
        type: string
      stripe_customer_id:
        type: string
      stripe_subscription_id:
        type: string
    type: object
  handlers.BuildAgentRequest:
    properties:
      current_prompt:
        type: string
      user_instructions:
        type: string
    required:
    - user_instructions
    type: object
  handlers.BuildAgentResponse:
    properties:
      changes:
        type: string
      improved_prompt:
        type: string
    type: object
  handlers.ChatStreamRequest:
    properties:
      agentId:
        type: string
      conversationId:
        type: string
      creatingAgent:
        type: boolean
      hasAgents:
        type: boolean
      message:
        type: string
      view:
        type: string
    required:
    - message
    type: object
  handlers.CreateAgentBuilderLogRequest:
    properties:
      content:
        type: string
      metadata:
        additionalProperties: true
        type: object
      parent_log_id:
        type: string
      type:
        type: string
    required:
    - type
    type: object
  handlers.CreateAgentRequest:
    properties:
      description:
        type: string
      instructions:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  handlers.DeleteResponse:
    properties:
      deleted:
        type: boolean
      message:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.MeResponse:
    properties:
      auth0_id:
        type: string
      billing:
        $ref: '#/definitions/handlers.Billing'
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      id:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  handlers.Paginated-handlers_AgentBuilderLogResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.AgentBuilderLogResponse'
        type: array
      meta:
        $ref: '#/definitions/handlers.PaginationMeta'
    type: object
  handlers.Paginated-handlers_AgentResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.AgentResponse'
        type: array
      meta:
        $ref: '#/definitions/handlers.PaginationMeta'
    type: object
  handlers.Paginated-handlers_AgentRunResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.AgentRunResponse'
        type: array
      meta:
        $ref: '#/definitions/handlers.PaginationMeta'
    type: object
  handlers.PaginationMeta:
    properties:
      page:
        example: 1
        type: integer
      page_size:
        example: 10
        type: integer
      total_count:
        example: 100
        type: integer
      total_pages:
        example: 10
        type: integer
    type: object
  handlers.RunAgentRequest:
    properties:
      input:
        type: string
      metadata: {}
      model:
        type: string
    type: object
  handlers.SingleResponse-handlers_AgentBuilderLogResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.AgentBuilderLogResponse'
    type: object
  handlers.SingleResponse-handlers_AgentResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.AgentResponse'
    type: object
  handlers.SingleResponse-handlers_AgentRunResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.AgentRunResponse'
    type: object
  handlers.SingleResponse-handlers_BuildAgentResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.BuildAgentResponse'
    type: object
  handlers.SingleResponse-handlers_MeResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.MeResponse'
    type: object
  handlers.SuccessResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  handlers.UpdateAgentRequest:
    properties:
      description:
        type: string
      instructions:
        type: string
      name:
        type: string
      user_preferences: {}
    type: object
  handlers.WebhookRequest:
    properties:
      data: {}
      type:
        type: string
    type: object
  routes.HealthResponse:
    properties:
      status:
        type: string
    type: object
host: localhost:8000
info:
  contact:
    email: hello@opper.ai
    name: Opper AI
    url: https://www.opper.ai
  description: Agento backend API for managing agents
  termsOfService: https://www.getagento.com/terms
  title: Agento API
  version: "1.0"
paths:
  /agents:
    get:
      consumes:
      - application/json
      description: Get all agents for the currently authenticated user's team with
        pagination support
      parameters:
      - default: 1
        description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - default: 10
        description: 'Number of items per page (default: 10, max: 100)'
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Paginated-handlers_AgentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List agents
      tags:
      - agents
    post:
      consumes:
      - application/json
      description: Create a new agent for the currently authenticated user's team
      parameters:
      - description: Agent creation data
        in: body
        name: agent
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.SingleResponse-handlers_AgentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create agent
      tags:
      - agents
  /agents/{agent_id}:
    delete:
      consumes:
      - application/json
      description: Delete an agent by ID for the current user's team
      parameters:
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.DeleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete agent
      tags:
      - agents
    get:
      consumes:
      - application/json
      description: Get a specific agent by ID for the current user's team
      parameters:
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SingleResponse-handlers_AgentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get agent
      tags:
      - agents
    put:
      consumes:
      - application/json
      description: Update an existing agent by ID for the current user's team
      parameters:
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      - description: Agent update data
        in: body
        name: agent
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SingleResponse-handlers_AgentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update agent
      tags:
      - agents
  /agents/{agent_id}/build:
    post:
      consumes:
      - application/json
      description: Improve an agent's prompt using AI based on user instructions
      parameters:
      - description: Agent UUID
        in: path
        name: agent_id
        required: true
        type: string
      - description: Build request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.BuildAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SingleResponse-handlers_BuildAgentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Build agent prompt
      tags:
      - agents
  /agents/{agent_id}/chat:
    post:
      consumes:
      - application/json
      description: Streams conversational updates, agent refinements, and run output
        via server-sent events
      parameters:
      - description: Agent ID or 'lobby' for general chat
        in: path
        name: agent_id
        required: true
        type: string
      - description: Chat stream payload
        in: body
        name: chat
        required: true
        schema:
          $ref: '#/definitions/handlers.ChatStreamRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: Streaming response
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stream chat with agent builder
      tags:
      - chat
  /agents/{agent_id}/logs:
    delete:
      consumes:
      - application/json
      description: Delete all chat transcript entries for the selected agent
      parameters:
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Clear agent chat logs
      tags:
      - chat
    get:
      consumes:
      - application/json
      description: Retrieve chat transcript entries for the selected agent with pagination
        support
      parameters:
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      - default: 1
        description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - default: 20
        description: 'Page size (default: 20, max: 100)'
        in: query
        name: page_size
        type: integer
      - description: Alias for page_size to support legacy clients
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Paginated-handlers_AgentBuilderLogResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List agent chat logs
      tags:
      - chat
    post:
      consumes:
      - application/json
      description: Append a new message, tool event, or metadata record to the selected
        agent's chat transcript
      parameters:
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      - description: Chat log payload
        in: body
        name: log
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAgentBuilderLogRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.SingleResponse-handlers_AgentBuilderLogResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create agent chat log entry
      tags:
      - chat
  /agents/{agent_id}/runs:
    get:
      consumes:
      - application/json
      description: Get all runs for a specific agent
      parameters:
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      - default: 1
        description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - default: 10
        description: 'Number of items per page (default: 10, max: 100)'
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Paginated-handlers_AgentRunResponse'
        "400":
          description: Bad Request
