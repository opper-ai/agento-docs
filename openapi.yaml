basePath: /v1
definitions:
  handlers.AgentResponse:
    properties:
      created_at:
        type: string
      created_by_id:
        type: integer
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: string
      instructions:
        type: string
      name:
        type: string
      project_id:
        type: integer
      team_id:
        type: integer
      updated_at:
        type: string
      user_preferences: {}
    type: object
  handlers.AgentRunResponse:
