basePath: /v1
definitions:
  db.ConnectionType:
    enum:
    - composio
    - global-mcp
    - custom-mcp
    type: string
    x-enum-varnames:
    - ConnectionTypeComposio
    - ConnectionTypeGlobalMcp
    - ConnectionTypeCustomMcp
  handlers.AgentResponse:
    properties:
      created_at:
        type: string
      created_by_id:
        type: integer
      deleted_at:
        type: string
      description:
        type: string
      enabled_tools:
        items:
          type: string
        type: array
      id:
        type: string
      instructions:
        type: string
      name:
        type: string
      project_id:
        type: integer
      team_id:
        type: integer
      updated_at:
        type: string
      user_preferences: {}
    type: object
  handlers.AgentRunResponse:
    properties:
      agent_id:
        type: string
      created_at:
        type: string
      duration:
        type: integer
      error:
        type: string
      id:
        type: string
      input:
        type: string
      metadata: {}
      output:
        type: string
      status:
        type: string
      team_id:
        type: integer
      updated_at:
        type: string
      usage: {}
    type: object
  handlers.Balance:
    properties:
      monthly_credits_left:
        type: integer
      monthly_credits_purchased:
        type: integer
      paid_credits_left:
        type: integer
    type: object
  handlers.Billing:
    properties:
      balance:
        $ref: '#/definitions/handlers.Balance'
      plan:
        type: string
      stripe_customer_id:
        type: string
      stripe_subscription_id:
        type: string
    type: object
  handlers.BuildAgentRequest:
    properties:
      current_prompt:
        type: string
      user_instructions:
        type: string
    required:
    - user_instructions
    type: object
  handlers.BuildAgentResponse:
    properties:
      changes:
        type: string
      improved_prompt:
        type: string
    type: object
  handlers.ChatStreamRequest:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  handlers.CreateAgentRequest:
    properties:
      description:
        type: string
      instructions:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  handlers.CreateMessageRequest:
    properties:
      content:
        type: string
      metadata:
        additionalProperties: true
        type: object
      parent_log_id:
        type: string
      type:
        type: string
    required:
    - type
    type: object
  handlers.CreateWebhookTokenRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  handlers.DeleteResponse:
    properties:
      deleted:
        type: boolean
      message:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.ExecuteAgentRunRequest:
    properties:
      input:
        type: string
      metadata: {}
      model:
        type: string
    required:
    - input
    type: object
  handlers.MeResponse:
    properties:
      auth0_id:
        type: string
      billing:
        $ref: '#/definitions/handlers.Billing'
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      id:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  handlers.MessagePart:
    properties:
      action:
        $ref: '#/definitions/handlers.MessagePartAction'
      actionLabel:
        type: string
      confidence:
        type: number
      cycleKey:
        type: string
      scratchpad:
        additionalProperties: {}
        type: object
      step:
        type: integer
      text:
        type: string
      toolCall:
        $ref: '#/definitions/handlers.MessagePartToolCall'
      toolResult:
        $ref: '#/definitions/handlers.MessagePartToolResult'
      type:
        type: string
    type: object
  handlers.MessagePartAction:
    properties:
      data:
        additionalProperties: true
        type: object
      type:
        type: string
    type: object
  handlers.MessagePartToolCall:
    properties:
      args:
        additionalProperties: true
        type: object
      name:
        type: string
    type: object
  handlers.MessagePartToolResult:
    properties:
      data: {}
      error:
        type: string
      executionTimeMs:
        type: integer
      response: {}
      result: {}
      success:
        type: boolean
      toolName:
        type: string
    type: object
  handlers.MessageResponse:
    properties:
      content:
        type: string
      conversationId:
        type: string
      createdAt:
        type: string
      id:
        type: string
      parts:
        items:
          $ref: '#/definitions/handlers.MessagePart'
        type: array
      role:
        description: '"user" or "assistant" or "system"'
        type: string
      timestamp:
        type: string
    type: object
  handlers.Paginated-handlers_AgentResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.AgentResponse'
        type: array
      meta:
        $ref: '#/definitions/handlers.PaginationMeta'
    type: object
  handlers.Paginated-handlers_AgentRunResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.AgentRunResponse'
        type: array
      meta:
        $ref: '#/definitions/handlers.PaginationMeta'
    type: object
  handlers.Paginated-handlers_MessageResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.MessageResponse'
        type: array
      meta:
        $ref: '#/definitions/handlers.PaginationMeta'
    type: object
  handlers.Paginated-handlers_WebhookTokenResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.WebhookTokenResponse'
        type: array
      meta:
        $ref: '#/definitions/handlers.PaginationMeta'
    type: object
  handlers.PaginationMeta:
    properties:
      page:
        example: 1
        type: integer
      page_size:
        example: 10
        type: integer
      total_count:
        example: 100
        type: integer
      total_pages:
        example: 10
        type: integer
    type: object
  handlers.SingleResponse-array_services_AgentConnection:
    properties:
      data:
        items:
          $ref: '#/definitions/services.AgentConnection'
        type: array
    type: object
  handlers.SingleResponse-array_services_ConnectionSummary:
    properties:
      data:
        items:
          $ref: '#/definitions/services.ConnectionSummary'
        type: array
    type: object
  handlers.SingleResponse-handlers_AgentResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.AgentResponse'
    type: object
  handlers.SingleResponse-handlers_AgentRunResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.AgentRunResponse'
    type: object
  handlers.SingleResponse-handlers_BuildAgentResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.BuildAgentResponse'
    type: object
  handlers.SingleResponse-handlers_MeResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.MeResponse'
    type: object
  handlers.SingleResponse-handlers_MessageResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.MessageResponse'
    type: object
  handlers.SingleResponse-handlers_WebhookTokenResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.WebhookTokenResponse'
    type: object
  handlers.SingleResponse-handlers_createConnectionResponse:
    properties:
      data:
        $ref: '#/definitions/handlers.createConnectionResponse'
    type: object
  handlers.SingleResponse-services_AgentConnection:
    properties:
      data:
        $ref: '#/definitions/services.AgentConnection'
    type: object
  handlers.SingleResponse-services_ConnectionSummary:
    properties:
      data:
        $ref: '#/definitions/services.ConnectionSummary'
    type: object
  handlers.SingleResponse-services_ConnectionsStatus:
    properties:
      data:
        $ref: '#/definitions/services.ConnectionsStatus'
    type: object
  handlers.SuccessResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  handlers.TriggerAgentRunRequest:
    properties:
      input:
        type: string
      metadata: {}
      model:
        type: string
      sync:
        description: If true, wait for agent run completion and return output
        type: boolean
    type: object
  handlers.UpdateAgentRequest:
    properties:
      description:
        type: string
      instructions:
        type: string
      name:
        type: string
      user_preferences: {}
    type: object
  handlers.WebhookTokenResponse:
    properties:
      agent_id:
        type: string
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      token:
        type: string
      token_prefix:
        type: string
    type: object
  handlers.agentConnectionUpdateRequest:
    properties:
      enabled:
        type: boolean
      enabled_tool_ids:
        items:
          type: string
        type: array
    type: object
  handlers.completeComposioCallbackRequest:
    properties:
      connected_account_id:
        type: string
      message:
        type: string
      provider_payload:
        additionalProperties: {}
        type: object
      provider_status:
        type: string
      status:
        type: string
      team_id:
        type: string
    type: object
  handlers.connectConnectionRequest:
    properties:
      callback_url:
        type: string
    type: object
  handlers.createConnectionRequest:
    properties:
      auth:
        additionalProperties: {}
        type: object
      callback_url:
        type: string
      category:
        type: string
      display_name:
        type: string
      enabled:
        type: boolean
      metadata:
        additionalProperties: {}
        type: object
      options:
        additionalProperties: {}
        type: object
      server_id:
        type: string
      tags:
        items:
          type: string
        type: array
      template_id:
        type: string
      toolkit_slug:
        type: string
      transport:
        type: string
      type:
        type: string
      url:
        type: string
    required:
    - type
    type: object
  handlers.createConnectionResponse:
    properties:
      connection:
        $ref: '#/definitions/services.ConnectionSummary'
      session:
        $ref: '#/definitions/services.ConnectionSession'
    type: object
  handlers.updateConnectionRequest:
    properties:
      auth:
        additionalProperties: {}
        type: object
      display_name:
        type: string
      enabled:
        type: boolean
      metadata:
        additionalProperties: {}
        type: object
      options:
        additionalProperties: {}
        type: object
      transport:
        type: string
      url:
        type: string
    type: object
  services.AgentConnection:
    properties:
      agent_enabled:
        type: boolean
      connection_id:
        type: string
      display_name:
        type: string
      enabled_tool_ids:
        items:
          type: string
        type: array
      metadata:
        additionalProperties: {}
        type: object
      slug:
        type: string
      team_enabled:
        type: boolean
      team_status:
        $ref: '#/definitions/types.ConnectionStatus'
      tools:
        items:
          $ref: '#/definitions/services.AgentConnectionTool'
        type: array
      type:
        $ref: '#/definitions/db.ConnectionType'
    type: object
  services.AgentConnectionTool:
    properties:
      description:
        type: string
      display_name:
        type: string
      enabled:
        type: boolean
      input_schema:
        items:
          type: integer
        type: array
      metadata:
        additionalProperties: {}
        type: object
      name:
        type: string
      tags:
        items:
          type: string
        type: array
      tool_id:
        type: string
    type: object
  services.ConnectionSession:
    properties:
      provider_payload:
        additionalProperties: {}
        type: object
      redirect_url:
        type: string
      session_id:
        type: string
    type: object
  services.ConnectionStatusCounts:
    properties:
      active:
        type: integer
      connected:
        type: integer
      disconnected:
        type: integer
      error:
        type: integer
      pending:
        type: integer
      total:
        type: integer
    type: object
  services.ConnectionSummary:
    properties:
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      logo:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      name:
        type: string
      slug:
        type: string
      status:
        $ref: '#/definitions/types.ConnectionStatus'
      template_id:
        type: string
      tool_count:
        type: integer
      tools:
        items:
          $ref: '#/definitions/services.ToolDefinition'
        type: array
      transport:
        type: string
      type:
        $ref: '#/definitions/db.ConnectionType'
      updated_at:
        type: string
      url:
        type: string
    type: object
  services.ConnectionsStatus:
    properties:
      by_type:
        additionalProperties:
          $ref: '#/definitions/services.ConnectionStatusCounts'
        type: object
      mcp_status:
        additionalProperties:
          type: boolean
        type: object
      overall:
        $ref: '#/definitions/services.ConnectionStatusCounts'
      pending_sessions:
        type: integer
    type: object
  services.ToolDefinition:
    properties:
      connection_id:
        type: string
      description:
        type: string
      display_name:
        type: string
      input_schema:
        items:
          type: integer
        type: array
      is_enabled:
        type: boolean
      metadata:
        additionalProperties: {}
        type: object
      name:
        type: string
      tags:
        items:
          type: string
        type: array
      tool_id:
        type: string
    type: object
  types.ConnectionStatus:
    enum:
    - pending
    - active
    - connected
    - disconnected
    - error
    type: string
    x-enum-varnames:
    - ConnectionStatusPending
    - ConnectionStatusActive
    - ConnectionStatusConnected
    - ConnectionStatusDisconnected
    - ConnectionStatusError
host: localhost:8000
info:
  contact:
    email: hello@opper.ai
    name: Opper AI
    url: https://www.opper.ai
  description: Agento backend API for managing agents
  termsOfService: https://www.getagento.com/terms
  title: Agento API
  version: "1.0"
paths:
  /agents:
    get:
      consumes:
      - application/json
      description: Get all agents for the currently authenticated user's team with
        pagination support
      parameters:
      - default: 1
        description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - default: 10
        description: 'Number of items per page (default: 10, max: 100)'
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.Paginated-handlers_AgentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List agents
      tags:
      - agents
    post:
      consumes:
      - application/json
      description: Create a new agent for the currently authenticated user's team
      parameters:
      - description: Agent creation data
        in: body
        name: agent
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.SingleResponse-handlers_AgentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create agent
      tags:
      - agents
  /agents/{agent_id}:
    delete:
      consumes:
      - application/json
      description: Delete an agent by ID for the current user's team
      parameters:
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.DeleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete agent
      tags:
      - agents
    get:
      consumes:
      - application/json
      description: Get a specific agent by ID for the current user's team
      parameters:
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SingleResponse-handlers_AgentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get agent
      tags:
      - agents
    patch:
      consumes:
      - application/json
      description: Update an existing agent by ID for the current user's team
      parameters:
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      - description: Agent update data
        in: body
        name: agent
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SingleResponse-handlers_AgentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update agent
      tags:
      - agents
    put:
      consumes:
      - application/json
      description: Update an existing agent by ID for the current user's team
      parameters:
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      - description: Agent update data
        in: body
        name: agent
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SingleResponse-handlers_AgentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update agent
      tags:
      - agents
  /agents/{agent_id}/build:
    post:
      consumes:
      - application/json
      description: Improve an agent's prompt using AI based on user instructions
      parameters:
      - description: Agent UUID
        in: path
        name: agent_id
        required: true
        type: string
      - description: Build request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.BuildAgentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SingleResponse-handlers_BuildAgentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Build agent prompt
      tags:
      - agents
  /agents/{agent_id}/chat:
    post:
      consumes:
      - application/json
      description: Streams conversational updates and chat responses via server-sent
        events. Only requires a message parameter.
      parameters:
      - description: Agent ID
        in: path
        name: agent_id
        required: true
        type: string
      - description: Chat stream payload containing only the message
        in: body
        name: chat
        required: true
        schema:
          $ref: '#/definitions/handlers.ChatStreamRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: Streaming response
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stream chat with agent builder
      tags:
      - chat
  /agents/{agent_id}/connections:
    get:
      description: List connections visible to the agent with team status and agent
        enablement metadata
      parameters:
      - description: Agent UUID
        in: path
        name: agent_id
        required: true
        type: string
      - description: Team UUID override
        in: query
        name: team_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SingleResponse-array_services_AgentConnection'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List agent connections
      tags:
      - agent-connections
  /agents/{agent_id}/connections/{connection_id}:
    patch:
      consumes:
      - application/json
      description: Update agent-level connection enablement and allowed tool IDs
      parameters:
      - description: Agent UUID
        in: path
        name: agent_id
        required: true
        type: string
      - description: Connection UUID
        in: path
        name: connection_id
        required: true
        type: string
      - description: Team UUID override
        in: query
