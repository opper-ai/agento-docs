      plan:
        type: string
      stripe_customer_id:
        type: string
      stripe_subscription_id:
        type: string
    type: object
  handlers.BuildAgentRequest:
    properties:
      current_prompt:
        type: string
      user_instructions:
        type: string
    required:
    - user_instructions
    type: object
  handlers.BuildAgentResponse:
    properties:
      changes:
        type: string
      improved_prompt:
        type: string
    type: object
  handlers.ChatStreamRequest:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  handlers.CreateAgentRequest:
    properties:
      description:
        type: string
      instructions:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  handlers.CreateMessageRequest:
    properties:
      content:
        type: string
      metadata:
        additionalProperties: true
        type: object
      parent_log_id:
        type: string
      type:
        type: string
    required:
    - type
    type: object
  handlers.CreateTeamMcpServerRequest:
    properties:
      auth:
        additionalProperties: {}
        type: object
      category:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      global_server_id:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      name:
        type: string
      options:
        additionalProperties: {}
        type: object
      server_id:
        type: string
      tags:
        items:
          type: string
        type: array
      transport:
        type: string
      url:
        type: string
    required:
    - name
    - server_id
    - url
    type: object
  handlers.DeleteResponse:
    properties:
      deleted:
        type: boolean
      message:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.McpServerResponse:
    properties:
      auth:
        additionalProperties: {}
        type: object
      category:
        type: string
      created_at:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      linked_global_id:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      name:
        type: string
      options:
        additionalProperties: {}
        type: object
      server_id:
        type: string
      source:
        type: string
      tags:
        items:
          type: string
        type: array
      transport:
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  handlers.MeResponse:
    properties:
      auth0_id:
        type: string
      billing:
        $ref: '#/definitions/handlers.Billing'
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      id:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  handlers.MessagePart:
    properties:
      action:
        $ref: '#/definitions/handlers.MessagePartAction'
      text:
        type: string
      toolCall:
        $ref: '#/definitions/handlers.MessagePartToolCall'
      toolResult:
        $ref: '#/definitions/handlers.MessagePartToolResult'
      type:
        type: string
    type: object
  handlers.MessagePartAction:
    properties:
      data:
        additionalProperties: true
        type: object
      type:
        type: string
    type: object
  handlers.MessagePartToolCall:
    properties:
      args:
        additionalProperties: true
        type: object
      name:
        type: string
    type: object
  handlers.MessagePartToolResult:
    properties:
      error:
        type: string
      result: {}
    type: object
  handlers.MessageResponse:
    properties:
      content:
        type: string
      conversationId:
        type: string
      createdAt:
        type: string
      id:
        type: string
      parts:
        items:
          $ref: '#/definitions/handlers.MessagePart'
        type: array
      role:
