      deleted_at:
        type: string
      email:
        type: string
      id:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  handlers.WebhookRequest:
    properties:
      data: {}
      type:
        type: string
    type: object
  models.ProjectWithCreatorResponse:
    properties:
      created_at:
        type: string
      created_by_display_name:
        type: string
      created_by_email:
        type: string
      created_by_id:
        type: integer
      created_by_uuid:
        type: string
      deleted_at:
