  handlers.composioConnectLinkRequest:
    properties:
      callback_url:
        type: string
      team_id:
        type: string
      toolkit:
        type: string
    type: object
  handlers.composioDisconnectRequest:
    properties:
      team_id:
        type: string
      toolkit:
